spring.application.name=career-scan

# MySQL Config
# ================================
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}

# JPA / Hibernate
# ================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Key+
# ================================
jwt.secret=${JWT_SECRET_KEY}

# Server
# ================================
server.port=8080

# File upload
# ================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# Groq AI Config
# ================================
groq.api.key =${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Adzuna — replaces JSearch
adzuna.app.id=${ADZUNA_APP_ID}
adzuna.app.key=${ADZUNA_APP_KEY}
adzuna.api.url=https://api.adzuna.com/v1/api/jobs

# Arbeitnow — no key needed
arbeitnow.api.url=https://arbeitnow.com/api/job-board-api

# JSearch via RapidAPI
jsearch.api.key=${JSEARCH_API_KEY}
jsearch.api.url=https://jsearch.p.rapidapi.com/search
jsearch.api.host=jsearch.p.rapidapi.com

spring.profiles.active=prod
